<!doctype html><html lang="pt-PT"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GC · Pré-visualização local</title><style>body{margin:0;background:#eff4f9;font-family:system-ui,sans-serif}.preview-header{background:#fff;border-bottom:1px solid #dce4ee;padding:16px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:#172c49}.preview-header strong{color:#215bbb}.preview-header small{color:#586b83}.preview-content{max-width:1440px;margin:0 auto;padding:20px}.preview-note{font-size:12px;color:#586b83}.gc-fh{margin:0!important}@media(max-width:600px){.preview-content{padding:10px}.preview-header{padding:12px}}</style>
<header class="preview-header"><strong>GC · Gestão Clínica</strong><span>Acompanhamento clínico</span><small>Pré-visualização local · dados fictícios · sem acesso a dados reais</small></header><main class="preview-content"><p class="preview-note" role="status" id="previewStatus">A carregar a versão de teste…</p><section id="gcExerciseHome" class="gc-fh" aria-label="Acompanhamento Clínico"></section></main>
<script type="module">
import {G} from '/modules/state.js';
import {homeDashboardStyles} from '/modules/home-dashboard.js';
import {loadExerciseHome} from '/modules/exercicio/followup-home.js';
const style=document.createElement('style');style.textContent=homeDashboardStyles();document.head.appendChild(style);
G.sessionUser={id:'32a24abe-cd69-42d9-bf3a-3355f4f6e28c'};
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const date=offset=>{const d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10);};
const person=(id,name,clinic='a')=>({patient_id:id,clinic_id:clinic,patients:{full_name:name}});
const rx=(id,p,data)=>({...p,id,status:'active',created_at:date(-20)+'T10:00:00Z',expires_at:date(40)+'T23:00:00Z',data});
const ana=person('ana','Ana Martins'),miguel=person('miguel','Miguel Costa','b'),rita=person('rita','Rita Santos'),paulo=person('paulo','Paulo Ferreira','b'),sofia=person('sofia','Sofia Almeida');
window.previewTables={
wo_prescriptions:[rx('rx-a',ana,{startDate:date(-10),endDate:date(7),sessions:[{session_id:'a1',date:date(-1),notes:'Origem: Capsulite — Fase 1.'},{session_id:'a2',date:date(0),notes:'Origem: Capsulite — Fase 1.'},{session_id:'a3',date:date(4),notes:'Origem: Capsulite — Fase 1.'}]}),rx('rx-m',miguel,{startDate:date(-10),endDate:date(3),dataRevisao:date(0),sessions:[{session_id:'m1',date:date(-1),modality:'Força'},{session_id:'m2',date:date(2),modality:'Caminhada'}]}),rx('rx-p',paulo,{startDate:date(-7),endDate:date(20),sessions:[{session_id:'p1',date:date(15),notes:'Origem: Ombro — Fase por confirmar.'}]}),rx('rx-s',sofia,{startDate:date(-5),endDate:date(25),sessions:[{session_id:'s1',date:date(20),modality:'Caminhada'}]})],
intake_tokens:[{...miguel,id:'q-m',questionnaire_type:'pre_consulta_v2',status:'in_progress',created_at:date(-3),expires_at:date(7)}],wo_followup_events:[],wo_followup_episode_events:[],
wo_session_logs:[{...miguel,id:'log-m',prescription_id:'rx-m',session_id:'m1',logged_at:date(-1)+'T18:35:00Z',rpe:5,feel:4,sets:[]}],
wo_session_readiness:[{...ana,id:'r-a1',prescription_id:'rx-a',session_id:'a1',session_date:date(-1),answered_at:date(-1)+'T08:10:00Z',feeling:2,has_symptoms:false},{...ana,id:'r-a2',prescription_id:'rx-a',session_id:'a2',session_date:date(0),answered_at:date(0)+'T08:10:00Z',feeling:1,has_symptoms:false}],wo_session_prescription_snapshots:[],
patient_diary_tokens:[{...ana,id:'d-a',created_at:date(-3),starts_at:date(-3)+'T00:00:00Z',status:'active',expires_at:date(12)},{...rita,id:'d-r',created_at:date(-3),starts_at:date(-3)+'T00:00:00Z',status:'active',expires_at:date(12)}],patient_diary_entries:[{...rita,id:'entry-r',entered_at:date(0)+'T07:40:00Z',raw_text:'Registo fictício para verificar a leitura do diário.'}],alerts:[],
patient_portal_links:[{id:'link-m',patient_id:'miguel',created_clinic_id:'b',patients:miguel.patients},{id:'link-r',patient_id:'rita',created_clinic_id:'a',patients:rita.patients}],patient_medication:[{id:'med-m',link_id:'link-m',clinic_id:'b',nome:'Medicação de demonstração',dose:'Conforme prescrito',enabled:true,data_inicio:date(-7),data_fim:date(6)},{id:'med-r',link_id:'link-r',clinic_id:'a',nome:'Medicação de demonstração',dose:'Conforme prescrito',enabled:true,data_inicio:date(-7),data_fim:date(1)}],patient_medication_events:[]};
window.sb={from(table){let conditions=[],range;const q={select(){return q;},in(key,values){conditions.push(r=>values.includes(r[key]));return q;},like(key,value){conditions.push(r=>String(r[key]).startsWith(value.replace('%','')));return q;},order(){return q;},range(a,b){range=[a,b];return q;},then(ok){let data=(window.previewTables[table]||[]).filter(r=>conditions.every(c=>c(r)));if(range)data=data.slice(range[0],range[1]+1);return Promise.resolve(ok({data,error:null}));}};return q;},async rpc(){document.getElementById('previewStatus').textContent='Demonstração: nenhuma decisão foi gravada. A versão publicada mantém-se.';return {data:null,error:{message:'Gravação desativada nesta pré-visualização.'}};}};
window.previewOptions={clinics:[{id:'a',name:'Clínica A'},{id:'b',name:'Clínica B'}],clinicIds:['a','b'],onOpen:()=>document.getElementById('previewStatus').textContent='Demonstração: a ficha real do doente não é aberta.'};
window.reloadPreview=()=>loadExerciseHome(window.previewOptions);await window.reloadPreview();document.getElementById('previewStatus').textContent='Versão de teste · módulos reais do GC, alimentados exclusivamente por exemplos fictícios. As decisões não são gravadas.';
</script></html>
