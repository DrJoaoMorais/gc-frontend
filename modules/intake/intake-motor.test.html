<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Intake — Teste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* Mesma URL/chave anon do resto do GC (feed-doente.html / diario.html) */
  window.SUPABASE_URL  = "https://nxfnzzcuqzxmzsihbrtp.supabase.co";
  window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54Zm56emN1cXp4bXpzaWhicnRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyODg3MjEsImV4cCI6MjA4NTg2NDcyMX0.Vk3-Aiq13fNMQWDyicHWErERWB5JBC9wZQ7OnVLmCnA";
  /* persistSession:false — página pública por token; nunca herdar sessão de staff que possa
     existir no mesmo browser (ex: computador da clínica com o GC aberto noutro separador). */
  window.sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
</script>
<style>
  :root{
    --navy:#0f2d52; --blue:#1a56db; --blue-soft:#eaf0fd; --blue-mid:#5b81e6;
    --paper:#ffffff; --bg:#f4f6fa; --ink:#1b2430; --muted:#8a93a0;
    --mist:#e5e9f0; --ok:#1f9d63; --warn-bg:#fff6ea; --warn-bd:#f0c988; --warn-ink:#9a5b00;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Outfit',sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh;}
  .phone{width:100%;max-width:420px;min-height:100vh;background:var(--bg);position:relative;}

  .test-banner{position:fixed;top:0;left:0;right:0;background:#fffbeb;border-bottom:1px solid #fde68a;color:#78350f;font-size:11px;padding:6px 10px;text-align:center;z-index:9999;}

  /* --- gates (loading / erro / rgpd / concluído) --- */
  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:10px;}
  .gate h2{font-family:'Cormorant Garamond',serif;color:var(--navy);font-size:22px;margin:0;}
  .gate p{color:var(--muted);font-size:14px;max-width:300px;line-height:1.5;margin:0;}
  .gate-rgpd{max-width:340px;margin:0 auto;}
  .gate-rgpd p{max-width:none;}
  .rgpd-info{width:100%;background:var(--paper);border:1px solid var(--mist);border-radius:12px;padding:10px 14px;margin:6px 0;}
  .rgpd-info-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
  .rgpd-info-row span{color:var(--muted);}
  .rgpd-info-row strong{color:var(--navy);font-weight:600;}
  .rgpd-check{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink);text-align:left;margin-top:6px;}
  .rgpd-check input{margin-top:2px;}

  .mini-btn{border:none;background:var(--blue);color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;padding:12px 20px;border-radius:12px;cursor:pointer;}
  .mini-btn:disabled{opacity:.5;cursor:default;}

  /* --- topbar / progresso --- */
  .app{padding-bottom:90px;}
  .topbar{background:var(--navy);padding:14px 18px;position:sticky;top:0;z-index:10;}
  .progress-tap{width:100%;background:none;border:none;padding:0;cursor:pointer;text-align:left;}
  .progress-bar{height:5px;background:rgba(255,255,255,.22);border-radius:4px;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;background:#fff;border-radius:4px;transition:width .25s ease;}
  .progress-label{display:flex;align-items:center;gap:6px;color:#fff;font-size:12.5px;font-weight:500;}
  .progress-label .chevron{color:rgba(255,255,255,.7);font-size:10px;}

  .secao-head{padding:20px 18px 6px;}
  .secao-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:4px;}
  .secao-head h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:24px;color:var(--navy);margin:0;}

  .perguntas{padding:10px 18px 20px;display:flex;flex-direction:column;gap:20px;}
  .q-lbl{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:9px;display:block;line-height:1.4;}
  .q-input, .q-textarea, .q-select{width:100%;border:1px solid var(--mist);border-radius:10px;padding:11px 12px;font-family:'Outfit',sans-serif;font-size:14.5px;color:var(--ink);background:var(--paper);}
  .q-input:focus, .q-textarea:focus, .q-select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.13);}
  .q-textarea{min-height:80px;resize:vertical;line-height:1.5;}
  .q-outro{margin-top:8px;}
  .q-nota{font-size:11.5px;color:var(--muted);margin-top:6px;}

  /* --- escolhas (círculo / quadrado) --- */
  .choice-list{display:flex;flex-direction:column;gap:8px;}
  .choice-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--mist);border-radius:12px;background:var(--paper);cursor:pointer;text-align:left;font-family:'Outfit',sans-serif;width:100%;}
  .choice-item.sel{border-color:var(--blue);background:var(--blue-soft);}
  .choice-mark{width:20px;height:20px;flex-shrink:0;border:2px solid var(--mist);position:relative;}
  .choice-mark.radio{border-radius:50%;}
  .choice-mark.check{border-radius:6px;}
  .choice-item.sel .choice-mark, .grelha-cell.sel .choice-mark{border-color:var(--blue);}
  .choice-item.sel .choice-mark.radio::after, .grelha-cell.sel .choice-mark.radio::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--blue);}
  .choice-item.sel .choice-mark.check::after{content:'';position:absolute;inset:3px;border-radius:2px;background:var(--blue);}
  .choice-label{font-size:14px;color:var(--ink);flex:1;}

  /* --- escala (reaproveita padrão bar/seg do diário) --- */
  .escala-top{display:flex;justify-content:flex-end;margin-bottom:6px;}
  .escala-val{font-size:16px;font-weight:600;color:var(--navy);}
  .bar{display:flex;gap:4px;}
  .seg{height:9px;flex:1;border-radius:5px;background:var(--mist);cursor:pointer;}
  .seg.on{background:var(--blue);}
  .escala-minmax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}

  /* --- grelha --- */
  .q-grelha .grelha-header{display:grid;grid-template-columns:1fr repeat(4,54px);align-items:end;gap:3px;margin-bottom:6px;}
  .q-grelha .grelha-header span{font-size:8.5px;color:var(--muted);text-align:center;line-height:1.15;word-break:break-word;hyphens:auto;}
  .grelha-linha{display:grid;grid-template-columns:1fr repeat(4,54px);align-items:center;gap:3px;padding:9px 0;border-top:1px solid var(--mist);}
  .grelha-linha:first-of-type{border-top:none;}
  .grelha-lbl{font-size:13px;color:var(--ink);line-height:1.3;padding-right:6px;}
  .grelha-cell{display:flex;align-items:center;justify-content:center;background:none;border:none;padding:4px;cursor:pointer;}
  .grelha-cell .choice-mark{width:18px;height:18px;}

  /* --- navbar --- */
  .navbar{position:fixed;bottom:0;left:0;right:0;max-width:420px;margin:0 auto;display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--mist);}
  .nav-btn{flex:1;border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;}
  .nav-btn.primary{border:none;background:var(--blue);color:#fff;}
  .nav-btn.ghost{border:1.5px solid var(--mist);background:#fff;color:var(--ink);}
  .nav-btn:disabled{opacity:.4;cursor:default;}

  /* --- toast --- */
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(6px);background:var(--navy);color:#fff;font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:9998;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .alerta-falha{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(10px);max-width:340px;width:calc(100% - 40px);background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-ink);font-size:13px;font-weight:500;padding:11px 15px;border-radius:12px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:9998;}
  .alerta-falha.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* --- índice de secções --- */
  .index-overlay{position:fixed;inset:0;background:rgba(15,45,82,.45);display:flex;align-items:flex-end;z-index:20;}
  .index-overlay[hidden]{display:none;}
  .index-sheet{width:100%;max-width:420px;margin:0 auto;background:var(--paper);border-radius:20px 20px 0 0;max-height:78vh;display:flex;flex-direction:column;}
  .index-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--mist);}
  .index-head h3{font-family:'Cormorant Garamond',serif;color:var(--navy);font-size:19px;margin:0;}
  .index-close{border:none;background:var(--bg);width:30px;height:30px;border-radius:50%;color:var(--muted);cursor:pointer;font-size:13px;}
  .index-list{overflow-y:auto;padding:8px 10px;}
  .index-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:11px 8px;border-radius:10px;cursor:pointer;text-align:left;font-family:'Outfit',sans-serif;}
  .index-item.atual{background:var(--blue-soft);}
  .index-item.bloqueada{opacity:.4;cursor:default;}
  .index-num{width:22px;height:22px;border-radius:50%;background:var(--mist);color:var(--muted);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .index-item.atual .index-num{background:var(--navy);color:#fff;}
  .index-titulo{flex:1;font-size:13.5px;color:var(--ink);}
  .index-check{color:var(--ok);font-weight:700;font-size:13px;}
</style>
</head>
<body>
<div class="test-banner">Página de teste — não é o URL de produção</div>
<div class="phone">
  <div id="intake-root"></div>
</div>
<script type="module" src="./intake-motor.js"></script>
</body>
</html>
